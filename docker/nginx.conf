server {
    listen 80;
    server_name _;

    root /app/kb-ui-dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All backend services are now proxied through main_control_service (domain-aware routing)
    # Frontend calls /api/control-plane/api/v1/proxy/{domain}/(llm|mining|serving)/*
    # which nginx forwards to main_control_service on port 8910
    location /api/control-plane/ {
        proxy_pass http://127.0.0.1:8910/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 600M;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
